<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b141a">
<title>Kübik Work</title>
<link rel="stylesheet" href="work.css?v=4"></head>
<body>
<header><div class="dot" id="initial">K</div><div><strong id="title">Kübik Work</strong><small>Yapay zekâ asistanı · Kübik</small></div></header>
<main id="log"><div class="start" id="start"><p>Merhaba! Konuşmaya başlamak için adını yaz.</p>
<form id="nameForm"><input id="name" maxlength="40" required placeholder="Adın" autocomplete="name"><button>Başla</button></form>
<p class="note">Cevapları yapay zekâ verir; işletme sahibi de görebilir ve araya girebilir.</p><p class="error" id="error"></p></div></main>
<form id="sendForm" hidden><input id="message" maxlength="2000" required placeholder="Mesaj yaz…" autocomplete="off"><button aria-label="Gönder">↑</button></form>
<script src="config.js?v=4"></script>
<script src="connection.js?v=4"></script>
<script src="work.js?v=4"></script>
</body></html>
